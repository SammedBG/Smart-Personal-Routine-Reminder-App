version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: smart_routines
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    command: ["python", "-m", "backend.app.scheduler.apscheduler_worker"]
    depends_on:
      - db

volumes:
  db_data:

