# Render Blueprint — 100% Free Forever Deployment with Neon.tech PostgreSQL
# Docs: https://docs.render.com/blueprint-spec

services:
  # ── API Server (Web Service) ──
  - type: web
    name: smartapp-api
    runtime: docker
    plan: free            # Render Free Tier (100% free)
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false       # Enter your Neon.tech database URL here in Render Dashboard
      - key: JWT_SECRET_KEY
        generateValue: true       # Render auto-generates a secure random secret
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # ── Scheduler Worker (Background Notifications Worker) ──
  - type: worker
    name: smartapp-scheduler
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.app.scheduler.apscheduler_worker
    envVars:
      - key: DATABASE_URL
        sync: false       # Use the same Neon.tech database URL
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: smartapp-api
          property: JWT_SECRET_KEY
      - key: JWT_REFRESH_SECRET_KEY
        fromService:
          type: web
          name: smartapp-api
          property: JWT_REFRESH_SECRET_KEY
      - key: ENVIRONMENT
        value: production

